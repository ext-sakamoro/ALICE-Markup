name: CI

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']

# a newer commit on the same branch stops the older run; on main every commit
# gets its own group and is not stopped
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    # the same document on each OS: the parser compares bytes and chars only
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the counting wrapper itself, before it counts anything (no build)
      - name: Tests of scripts/cargo_test_min.sh (no build)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_cargo_test_min.py
      # at least 64 tests (unit 6, oracle 52, properties 4, README 1, doctest 1): a run that loses a test file or
      # executes nothing fails instead of passing
      - name: Test
        run: bash scripts/cargo_test_min.sh 64
      - name: Test (release)
        run: bash scripts/cargo_test_min.sh 64 --release

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

  targets:
    name: no_std and wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (thumbv7em-none-eabihf)
        run: cargo build --lib --target thumbv7em-none-eabihf
      - name: Clippy (thumbv7em-none-eabihf)
        run: cargo clippy --lib --target thumbv7em-none-eabihf -- -D warnings
      - name: Build (wasm32-unknown-unknown)
        run: cargo build --lib --target wasm32-unknown-unknown

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc tests
        run: cargo test --doc

  fuzz-build:
    # the fuzz targets keep compiling; fuzz.yml runs them
    name: Fuzz targets build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build fuzz targets
        run: cargo +nightly build --manifest-path fuzz/Cargo.toml --bins
