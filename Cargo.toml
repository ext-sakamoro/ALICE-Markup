[package]
name = "alice-markup"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "A small deterministic Markdown subset: headings, paragraphs, lists, quotes, fenced code, emphasis, code spans and links, with the text a reader sees"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Markup"
keywords = ["markdown", "parser", "no_std", "deterministic"]
categories = ["parser-implementations", "text-processing", "no-std"]

[dependencies]

[dev-dependencies]
# test-only bounds: a ceiling on live bytes and a deadline per parse (never published)
alice-markup-test-bounds = { path = "tests/bounds" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
